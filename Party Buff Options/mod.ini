Description=Options for the buff icons in the party and group windows: show or hide them, their size, and "Always show title bar". Set them in Party Options and in the group window's gear panel. Makes both windows wide enough for a full row of buffs. Switch: the Add-ons button in the menu.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Add-ons window: the add-on switches and settings moved out of Options into their own window (the new Add-ons button in the menu), sorted into sections.
Priority=5
