[Mod]
Name=Party Buff Options
Version=1.0
Author=Zurnny
Group=
Description=Options for the buff icons in the party and group windows: show or hide them, their size, and "Always show title bar". Set them in Party Options and in the group window's gear panel. Makes both windows wide enough for a full row of buffs. Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. The Steampunk UI theme already has this built in, so it isn't needed with Steampunk.
Changes=First release as its own add-on (was part of Party and Group Extras).
Priority=5
